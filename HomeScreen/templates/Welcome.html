{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Map - Nguyễn Trọng Văn Viết</title>
    
    <!-- Leaflet CSS for mapping -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    
    <!-- Custom Map CSS -->
    <link rel="stylesheet" href="{% static 'css/map.css' %}">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        body {
            display: flex;
            flex-direction: column;
        }
        
        .toolbar {
            background: white;
            border-bottom: 2px solid #667eea;
            padding: 15px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }
        
        .toolbar h1 {
            color: #333;
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        
        .toolbar h1 u {
            color: #667eea;
        }
        
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .search-box input {
            flex: 1;
            max-width: 400px;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .search-box button {
            padding: 10px 20px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .search-box button:hover {
            background-color: #218838;
        }
        
        .map-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .map-btn {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.3s;
        }
        
        .map-btn:hover {
            background-color: #0056b3;
        }
        
        .map-btn.secondary {
            background-color: #6c757d;
        }
        
        .map-btn.secondary:hover {
            background-color: #5a6268;
        }
        
        #map {
            width: 100%;
            flex: 1;
            background-color: #f0f0f0;
        }
        
        .coordinates {
            display: none;
        }
        
        .location-info {
            display: none;
        }
        
        .loading {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Toolbar -->
    <div class="toolbar">
        <h1>🗺️ Interactive Map - <u>{{ name }}</u></h1>
        
        <!-- Search Box -->
        <div class="search-box">
            <input 
                type="text" 
                id="search-input" 
                placeholder="Search for a location (e.g., 'Paris', 'Tokyo', 'New York', 'Ho Chi Minh City')"
            >
            <button onclick="searchLocation()">Search</button>
        </div>
        
        <!-- Map Controls -->
        <div class="map-controls">
            <button class="map-btn" onclick="centerOnLocation()">📍 My Location</button>
            <button class="map-btn" onclick="map.setView([10.8231, 106.6797], 12)">🏠 Ho Chi Minh City</button>
            <button class="map-btn" onclick="map.setView([21.0285, 105.8542], 12)">🏯 Hanoi</button>
            <button class="map-btn" onclick="map.setView([10.3157, 103.8484], 12)">🌴 Can Tho</button>
            <button class="map-btn secondary" onclick="clearMarkers()">🗑️ Clear Markers</button>
        </div>
    </div>
    
    <!-- Full Screen Map -->
    <div id="map"></div>

    <!-- Journey Panel -->
    <div id="journey-panel" class="journey-panel hidden">
        <div class="journey-panel-header">
            <div>
                <p class="journey-panel-title">Journey plan</p>
                <p id="journey-summary" class="journey-panel-summary"></p>
            </div>
            <button class="journey-panel-close" onclick="window.clearJourneyPlan()" title="Clear journey">×</button>
        </div>
        <ol id="journey-stops" class="journey-stops"></ol>
    </div>
    
    <!-- Hidden Info Panels -->
    <div id="coordinates" class="coordinates"></div>
    <div id="location-info" class="location-info"></div>
    <div id="loading" class="loading"></div>
    
    <!-- Leaflet JS for mapping -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    
    <!-- Custom Journey Panel CSS -->
    <style>
        .journey-panel {
            position: fixed;
            top: 110px;
            right: 20px;
            width: 320px;
            max-height: 60vh;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border-radius: 12px;
            padding: 16px;
            z-index: 7000;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .journey-panel.hidden {
            display: none;
        }

        .journey-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .journey-panel-title {
            margin: 0;
            font-weight: 600;
            color: #333;
        }

        .journey-panel-summary {
            margin: 4px 0 0 0;
            font-size: 13px;
            color: #666;
        }

        .journey-panel-close {
            border: none;
            background: #f1f1f1;
            color: #444;
            font-size: 18px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            line-height: 1;
        }

        .journey-panel-close:hover {
            background: #e0e0e0;
        }

        .journey-stops {
            list-style: decimal inside;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .journey-stops li {
            background: rgba(102, 126, 234, 0.08);
            padding: 10px 12px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }

        .journey-stop-category {
            display: inline-block;
            margin-left: 6px;
            font-size: 12px;
            color: #764ba2;
            text-transform: capitalize;
        }

        .journey-stop-notes {
            margin-top: 4px;
            font-size: 12px;
            color: #555;
        }

        .journey-stop-meta {
            margin-top: 4px;
            font-size: 12px;
            color: #888;
        }

        @media (max-width: 900px) {
            .journey-panel {
                position: static;
                width: auto;
                max-height: none;
                margin: 10px 20px;
            }
        }
    </style>
    
    <!-- Custom Map Script -->
    <script src="{% static 'js/map.js' %}"></script>
</body>
</html>
